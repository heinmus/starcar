name: Build StarCar App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Locate Flutter Project Directory and Build
        run: |
          # Procura a pasta onde está o arquivo pubspec.yaml
          PUBSPEC_DIR=$(find . -maxdepth 2 -name "pubspec.yaml" -exec dirname {} \;)
          echo "Projeto localizado em: $PUBSPEC_DIR"
          cd "$PUBSPEC_DIR"
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          
          # Copia o APK gerado para a raiz do build para o upload encontrar
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/app-release.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: output/app-release.apk
